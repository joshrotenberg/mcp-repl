name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily compatibility lane against tower-mcp git main.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  quality:
    name: Quality
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Deterministic parser properties
        run: cargo test --lib property_
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  package:
    name: Package
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify publishable package
        run: cargo package --locked

  msrv:
    name: Rust 1.90 MSRV
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Check every target and feature at the declared MSRV
        run: cargo check --all-targets --all-features --locked

  workflow-lint:
    name: Workflow and installer lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          checksums="actionlint_${version}_checksums.txt"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --silent --show-error --location --remote-name "$base/$archive"
          curl --fail --silent --show-error --location --remote-name "$base/$checksums"
          grep "  $archive\$" "$checksums" | sha256sum --check --strict
          tar xzf "$archive" actionlint
      - name: Lint workflows
        run: ./actionlint
      - name: Lint release and installer scripts
        run: |
          shellcheck install.sh scripts/*.sh
          sh -n install.sh
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Release guard behavior
        # Syntax checks cannot tell whether a guard reports the right thing,
        # and these only run while a release is being published. This drives
        # them against a stubbed `gh`.
        run: ./scripts/test-release-guards.sh

  windows-directories:
    name: Windows directories
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test native config, state, and discovery paths
        run: cargo test --lib windows_directories

  release-native:
    name: Native release rehearsal
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-plz-')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-plz-'))
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      version: ci-${{ github.run_id }}
      upload: false

  release-gate:
    name: Release gate
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-plz-')))
    needs:
      - quality
      - package
      - msrv
      - workflow-lint
      - windows-directories
      - deny
      - release-native
    runs-on: ubuntu-latest
    env:
      QUALITY: ${{ needs.quality.result }}
      PACKAGE: ${{ needs.package.result }}
      MSRV: ${{ needs.msrv.result }}
      WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
      WINDOWS_DIRECTORIES: ${{ needs.windows-directories.result }}
      DEPENDENCIES: ${{ needs.deny.result }}
      NATIVE_RELEASE: ${{ needs.release-native.result }}
      IS_RELEASE_BRANCH: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-plz-')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-plz-')) }}
    steps:
      - name: Require every release prerequisite
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$QUALITY" \
            "$PACKAGE" \
            "$MSRV" \
            "$WORKFLOW_LINT" \
            "$WINDOWS_DIRECTORIES" \
            "$DEPENDENCIES"
          do
            if [[ "$result" != success ]]; then
              echo "A required check finished with status: $result" >&2
              exit 1
            fi
          done

          if [[ "$IS_RELEASE_BRANCH" == true && "$NATIVE_RELEASE" != success ]]; then
            echo "Native release rehearsal finished with status: $NATIVE_RELEASE" >&2
            exit 1
          fi

          if [[ "$IS_RELEASE_BRANCH" != true && "$NATIVE_RELEASE" != skipped ]]; then
            echo "Unexpected native release rehearsal status: $NATIVE_RELEASE" >&2
            exit 1
          fi

  deny:
    name: Dependencies
    # Runs on the schedule too, unlike the other default jobs: an advisory is
    # published against a dependency that did not change, so waiting for the
    # next commit to hear about it defeats the point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  tower-mcp-main:
    name: tower-mcp main compatibility
    # Dogfooding lane: the default jobs test the released framework; this one
    # patches in tower-mcp git main so upstream client-surface breaks surface
    # here within a day instead of at the next release. A failure that only
    # reproduces in this job means tower-mcp main moved, not that mcp-repl
    # regressed. The patch stops applying if main's version leaves the
    # declared semver range; that failure mode is the intended signal too.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !startsWith(github.ref_name, 'release-plz-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Patch tower-mcp to git main
        run: |
          cat >> Cargo.toml <<'PATCH'

          [patch.crates-io]
          tower-mcp = { git = "https://github.com/joshrotenberg/tower-mcp" }
          PATCH
          cargo update -p tower-mcp
      - name: Test against tower-mcp main
        run: cargo test --all-targets --all-features
