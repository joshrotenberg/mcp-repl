name: Release draft recovery

# Exceptional recovery for a complete canonical release set stranded behind a
# defective frozen draft publisher. The dispatch selects immutable failed-run
# evidence plus an untrusted numeric draft candidate; executable code always
# comes from the reviewed default branch, and only the write-scoped job can
# authenticate the push-visible private release.
on:
  repository_dispatch:
    types: [release_draft_recovery]

permissions: {}

concurrency:
  # Share the repository-wide mutable-release lock with normal publication and
  # the latest-only recovery controller.
  group: release-binaries-latest
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Authenticate failed draft publication
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      artifact_digest: ${{ steps.recovery.outputs.artifact_digest }}
      artifact_id: ${{ steps.recovery.outputs.artifact_id }}
      release_merge_sha: ${{ steps.recovery.outputs.release_merge_sha }}
      release_tag: ${{ steps.recovery.outputs.release_tag }}
      run_attempt: ${{ steps.recovery.outputs.run_attempt }}
      run_id: ${{ steps.recovery.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate the exact failed release evidence
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/verify-release-draft-recovery.sh \
            preflight "$GITHUB_OUTPUT"

  resume:
    name: Resume the exact bot-owned draft
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reauthenticate live evidence before write authority is used
        id: reauth
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.preflight.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          EXPECTED_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          RELEASE_MERGE_SHA: ${{ needs.preflight.outputs.release_merge_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_RUN_ATTEMPT: ${{ needs.preflight.outputs.run_attempt }}
          RELEASE_RUN_ID: ${{ needs.preflight.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$RUNNER_TEMP/resume-output"
          expected="$RUNNER_TEMP/expected-resume-output"
          : > "$actual"
          ./scripts/verify-release-draft-recovery.sh resume "$actual"
          printf '%s\n' \
            "release_merge_sha=$RELEASE_MERGE_SHA" \
            "run_id=$RELEASE_RUN_ID" \
            "run_attempt=$RELEASE_RUN_ATTEMPT" \
            "artifact_id=$ARTIFACT_ID" \
            "artifact_digest=$ARTIFACT_DIGEST" \
            "release_id=$EXPECTED_RELEASE_ID" \
            "release_tag=$RELEASE_TAG" > "$expected"
          cmp "$expected" "$actual"
          cat "$actual" >> "$GITHUB_OUTPUT"

      - name: Download and hash the authenticated canonical release set
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.reauth.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.reauth.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ATTEMPT: ${{ steps.reauth.outputs.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ||
                ! "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid authenticated artifact identity" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/release-supply.zip"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$archive"
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" "$archive" |
            sha256sum --check --strict

          entries="$RUNNER_TEMP/release-supply-entries"
          unzip -Z1 "$archive" > "$entries"
          if [[ $(wc -l < "$entries" | tr -d '[:space:]') -ne 39 ]] ||
            ! awk '
              !/^[A-Za-z0-9][A-Za-z0-9._+-]*$/ { bad = 1 }
              seen[$0]++ { bad = 1 }
              END { exit bad }
            ' "$entries"; then
            echo "Canonical release artifact has an unsafe ZIP inventory" >&2
            exit 1
          fi
          artifact_dir="artifact-downloads/release-supply-$RELEASE_RUN_ATTEMPT"
          mkdir -p "$artifact_dir"
          unzip -q "$archive" -d "$artifact_dir"

      - name: Select the exact retained producer artifact
        shell: bash
        env:
          RELEASE_RUN_ATTEMPT: ${{ steps.reauth.outputs.run_attempt }}
        run: |
          set -euo pipefail
          mkdir release
          ./scripts/select-run-artifacts.sh \
            "$RELEASE_RUN_ATTEMPT" \
            artifact-downloads \
            release \
            release-supply

      - name: Prepare the authenticated historical source as data
        shell: bash
        env:
          RELEASE_MERGE_SHA: ${{ steps.reauth.outputs.release_merge_sha }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/release-source"
          git worktree add --detach "$source_root" "$RELEASE_MERGE_SHA"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$RELEASE_MERGE_SHA"

          # The historical checkout supplies only source-bound metadata. Every
          # executable in the publisher's call graph is overlaid from this
          # reviewed default-branch checkout and compared byte for byte.
          controllers=(
            extract-release-notes.sh
            publish-release.sh
            release-targets.sh
            verify-release.sh
            verify-release-tag.sh
          )
          for controller in "${controllers[@]}"; do
            current="scripts/$controller"
            historical="$source_root/scripts/$controller"
            if [[ ! -f "$current" || -L "$current" ||
                  ! -f "$historical" || -L "$historical" ]]; then
              echo "Unsafe recovery controller path: $controller" >&2
              exit 1
            fi
            install -m 0755 "$current" "$historical"
            cmp "$current" "$historical"
          done
          printf 'RECOVERY_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"

      - name: Resume and finalize only the authenticated draft
        shell: bash
        env:
          EXPECTED_RELEASE_ID: ${{ steps.reauth.outputs.release_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MERGE_SHA: ${{ steps.reauth.outputs.release_merge_sha }}
          RELEASE_TAG: ${{ steps.reauth.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git -C "$RECOVERY_SOURCE_ROOT" rev-parse HEAD)" = \
            "$RELEASE_MERGE_SHA"
          "$RECOVERY_SOURCE_ROOT/scripts/publish-release.sh" \
            resume \
            "$RELEASE_TAG" \
            "$GITHUB_WORKSPACE/release" \
            "$EXPECTED_RELEASE_ID"
