name: Container

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish
        required: false
        default: ""
        type: string
      push:
        description: Push the image to GHCR
        required: false
        default: false
        type: boolean

permissions:
  contents: read
# This also limits cache tokens when invoked by a dispatch on main.
cache-mode: read

jobs:
  prepare:
    name: Build and verify image
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Record release source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.push }}
        run: |
          version=$(awk -F'"' '/^\[package\]/ { in_package = 1 } in_package && /^version = / { print $2; exit }' Cargo.toml)
          test -n "$version"
          if [[ "$PUBLISH" == true ]]; then
            test -n "$RELEASE_TAG"
            test "${RELEASE_TAG#v}" = "$version"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build OCI image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # One archive reference keeps the later copy unambiguous.
          tags: ghcr.io/${{ github.repository }}:${{ steps.source.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          outputs: type=oci,dest=${{ runner.temp }}/mcp-repl.oci.tar
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Verify OCI copy preserves platforms and attestations
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/verified-digest" \
            "oci-archive:$RUNNER_TEMP/mcp-repl.oci.tar" "oci:$RUNNER_TEMP/verified-oci:release"
          test "$(cat "$RUNNER_TEMP/verified-digest")" = "$EXPECTED_DIGEST"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "verified-oci"
          def blob(descriptor):
              algorithm, digest = descriptor["digest"].split(":", 1)
              return json.loads((root / "blobs" / algorithm / digest).read_bytes())

          layout = json.loads((root / "index.json").read_bytes())
          assert len(layout["manifests"]) == 1, "expected one copied image index"
          index = blob(layout["manifests"][0])
          images = [m for m in index["manifests"] if m.get("platform", {}).get("os") == "linux"]
          assert {m["platform"]["architecture"] for m in images} == {"amd64", "arm64"}, "missing image platform"
          for image in images:
              predicates = set()
              for descriptor in index["manifests"]:
                  if descriptor.get("annotations", {}).get("vnd.docker.reference.digest") == image["digest"]:
                      for layer in blob(descriptor)["layers"]:
                          if layer["mediaType"] == "application/vnd.in-toto+json":
                              statement = blob(layer)
                              kind = statement["predicateType"]
                              predicates.add(kind)
                              if kind.startswith("https://slsa.dev/provenance/"):
                                  predicate = statement["predicate"]
                                  if kind == "https://slsa.dev/provenance/v0.2":
                                      metadata = predicate["metadata"]["https://mobyproject.org/buildkit@v1#metadata"]
                                  elif kind == "https://slsa.dev/provenance/v1":
                                      metadata = predicate["runDetails"]["metadata"]["buildkit_metadata"]
                                  else:
                                      raise ValueError(f"unsupported provenance schema: {kind}")
                                  # Buildx reports local-context VCS metadata from the checkout.
                                  assert metadata["vcs"]["revision"] == os.environ["EXPECTED_SHA"], "provenance commit mismatch"
                                  assert metadata["vcs"]["source"].removesuffix(".git") == os.environ["EXPECTED_SOURCE"], "provenance repository mismatch"
              assert "https://spdx.dev/Document" in predicates, "missing platform SBOM"
              assert any(p.startswith("https://slsa.dev/provenance/") for p in predicates), "missing platform provenance"
          PY
      - name: Load native image for smoke test
        run: skopeo --override-os linux --override-arch amd64 copy "oci:$RUNNER_TEMP/verified-oci:release" docker-daemon:mcp-repl:ci
      - name: Smoke test image
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: sh scripts/container-smoke.sh mcp-repl:ci "$VERSION"
      - name: Save verified OCI image
        if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-oci
          path: ${{ runner.temp }}/mcp-repl.oci.tar
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish image
    needs: prepare
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Checkout current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: joshrotenberg/mcp-repl
          ref: main
          path: .release-policy
          sparse-checkout: scripts
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Fetch verified OCI image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-oci
          path: ${{ runner.temp }}/container-oci
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check deadline and publish each image tag
        id: push
        env:
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: |
          test -n "$IMAGE_TAGS"
          while IFS= read -r image_tag; do
            test -n "$image_tag" || continue
            python3 .release-policy/scripts/check_advisory_expiry.py --source-root .
            skopeo copy --all --preserve-digests --dest-authfile "$HOME/.docker/config.json" \
              --digestfile "$RUNNER_TEMP/published-digest" \
              "oci-archive:$RUNNER_TEMP/container-oci/mcp-repl.oci.tar" "docker://$image_tag"
            test "$(cat "$RUNNER_TEMP/published-digest")" = "$EXPECTED_DIGEST"
          done <<< "$IMAGE_TAGS"
          echo "digest=$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"

  # The prepare build emulates arm64 under QEMU and only smoke-tests amd64.
  # Pull the exact pushed index on a native runner for each architecture and
  # run the same smoke test the pull request build runs.
  verify-published:
    name: Verify published image (${{ matrix.platform }})
    needs: [prepare, publish]
    if: inputs.push
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: docker pull --platform "$PLATFORM" "$IMAGE"
      - name: Smoke test image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: sh scripts/container-smoke.sh "$IMAGE" "${TAG#v}"
