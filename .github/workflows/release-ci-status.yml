name: Release CI status

on:
  workflow_run:
    workflows: [CI]
    # `requested` is earliest for a new dispatch; GitHub omits it on reruns,
    # so `in_progress` resets the status for those too.
    types: [requested, in_progress, completed]

permissions: {}

# A rerun keeps the source run ID. Serialize its bridge events so an older
# in-progress event cannot race a newer completion or rerun.
concurrency:
  group: release-ci-status-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    name: Report release CI status
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'release-plz-') &&
      github.event.workflow_run.actor.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Mirror the release gate onto its commit
        shell: bash
        run: |
          set -euo pipefail

          # Read the run again instead of trusting this event's snapshot. A
          # delayed in-progress event can arrive after completion, and a rerun
          # reuses the same run ID with a newer attempt.
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          event=$(jq -r '.event' <<<"$run")
          branch=$(jq -r '.head_branch // ""' <<<"$run")
          head_repo=$(jq -r '.head_repository.full_name // ""' <<<"$run")
          actor=$(jq -r '.actor.login // ""' <<<"$run")

          if [[ "$event" != workflow_dispatch ||
                "$head_repo" != "$GITHUB_REPOSITORY" ||
                "$branch" != release-plz-* ||
                "$actor" != 'github-actions[bot]' ]]; then
            echo "Source run no longer matches the trusted release-CI boundary" >&2
            exit 1
          fi

          sha=$(jq -er '.head_sha' <<<"$run")
          url=$(jq -er '.html_url' <<<"$run")
          status=$(jq -er '.status' <<<"$run")
          conclusion=$(jq -r '.conclusion // ""' <<<"$run")

          if [[ "$status" != completed ]]; then
            state=pending
            description="Release CI is ${status}"
          else
            gate=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "Release gate")] |
                    if length == 1 then .[0].conclusion else "" end')
            if [[ "$conclusion" == success && "$gate" == success ]]; then
              state=success
              description='Release CI passed'
            elif [[ "$conclusion" == success ]]; then
              state=failure
              description='Release CI did not report a passing gate'
            else
              state=failure
              description="Release CI finished with ${conclusion:-unknown}"
            fi
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state="$state" \
            -f target_url="$url" \
            -f description="$description" \
            -f context='Release gate' \
            > /dev/null

          echo "Release gate: $state ($sha)"
