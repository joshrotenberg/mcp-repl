name: Release publish

# Publication is deliberately separate from the coalesced release-PR updater.
# Every main commit receives this attempt, so a later push cannot discard the
# one run that was triggered by merging the generated release PR.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

env:
  # Cargo's normalized `.crate` bytes vary by Cargo release. Both sides of the
  # registry-checksum comparison must use this one reviewed toolchain.
  RELEASE_RUST: 1.97.1

concurrency:
  # Duplicate attempts for one immutable merge serialize, while different main
  # commits can never cause each other's publication run to be discarded.
  group: release-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      is_release_merge: ${{ steps.release-merge.outputs.is_release_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Match exactly one trusted release PR
        id: release-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/discover-release-merge.sh "$GITHUB_OUTPUT"

  verify-package:
    name: Verify package without credentials
    needs: preflight
    if: needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Keep `.crate` bytes stable across retries: reconciliation compares
          # the registry checksum with a freshly packaged exact commit.
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Verify exact package without a registry credential
        run: cargo package --locked

  publish:
    name: Attempt locked crate publication
    needs:
      - preflight
      - verify-package
    if: needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_outcome: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Upload exact locked source crate without build execution
        id: publish
        continue-on-error: true
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Force Cargo's built-in provider so no repository-configured helper
          # process can inherit the high-value registry credential.
          CARGO_REGISTRY_CREDENTIAL_PROVIDER: cargo:token
        run: >-
          cargo publish --locked --no-verify
          --registry crates-io
          --package mcp-repl

  reconcile:
    name: Stage immutable GitHub release
    needs:
      - preflight
      - publish
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Reconcile registry, immutable tag, and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OUTCOME: ${{ needs.publish.outputs.publish_outcome }}
        run: ./scripts/reconcile-source-release.sh "$GITHUB_SHA" "$RELEASE_OUTCOME"

  dispatch:
    name: Dispatch immutable native publication
    needs:
      - preflight
      - reconcile
    if: needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Dispatch binary publication for a release merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --force --tags
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "mcp-repl") | .version')
          tag="v$version"
          ./scripts/dispatch-release-binaries.sh "$tag" "$GITHUB_SHA"
