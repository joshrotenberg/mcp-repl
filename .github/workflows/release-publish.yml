name: Release publish

# Publication is deliberately separate from the coalesced release-PR updater.
# Every main commit receives this attempt, so a later push cannot discard the
# one run that was triggered by merging the generated release PR.
on:
  push:
    branches:
      - main
  # Exceptional recovery runs current reviewed default-branch code. The
  # request supplies only immutable evidence for one failed release attempt;
  # it can never select a checkout or publication source.
  repository_dispatch:
    types: [release_publish_recovery]

permissions: {}

env:
  # Cargo's normalized `.crate` bytes vary by Cargo release. Both sides of the
  # registry-checksum comparison must use this one reviewed toolchain.
  RELEASE_RUST: 1.97.1

concurrency:
  # Duplicate attempts for one immutable merge serialize, while different main
  # commits can never cause each other's publication run to be discarded.
  group: release-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      is_release_merge: ${{ steps.release-merge.outputs.is_release_merge == 'true' || steps.recovery.outputs.is_release_merge == 'true' }}
      recovery_release_sha: ${{ steps.recovery.outputs.recovery_release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match exactly one trusted release PR
        id: release-merge
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/discover-release-merge.sh "$GITHUB_OUTPUT"
      - name: Authenticate one failed source-publication recovery
        id: recovery
        if: github.event_name == 'repository_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-release-recovery.sh pre-publish "$GITHUB_OUTPUT"

  verify-package:
    name: Verify package without credentials
    needs: preflight
    if: needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Keep `.crate` bytes stable across retries: reconciliation compares
          # the registry checksum with a freshly packaged exact commit.
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Verify exact package without a registry credential
        run: cargo package --locked

  publish:
    name: Attempt locked crate publication
    needs:
      - preflight
      - verify-package
    if: needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_outcome: ${{ steps.publish.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Upload exact locked source crate without build execution
        id: publish
        continue-on-error: true
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Force Cargo's built-in provider so no repository-configured helper
          # process can inherit the high-value registry credential.
          CARGO_REGISTRY_CREDENTIAL_PROVIDER: cargo:token
        run: >-
          cargo publish --locked --no-verify
          --registry crates-io
          --package mcp-repl

  reconcile:
    name: Verify published crate identity
    needs:
      - preflight
      - publish
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.is_release_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Reconcile the exact crates.io package
        shell: bash
        env:
          RELEASE_OUTCOME: ${{ needs.publish.outputs.publish_outcome }}
        run: ./scripts/reconcile-source-release.sh "$GITHUB_SHA" "$RELEASE_OUTCOME"

  binaries:
    name: Publish immutable binary release
    needs:
      - preflight
      - reconcile
    if: needs.preflight.outputs.is_release_merge == 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/release-binaries.yml
    with:
      recovery_release_sha: ${{ needs.preflight.outputs.recovery_release_sha }}
