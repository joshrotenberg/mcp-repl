name: Release latest recovery

# One-shot recovery for v0.3.5 after its immutable release succeeded but the
# frozen attempt-2 controller failed before creating GHCR's mutable `latest`
# alias. The payload can select only the hard-coded incident; executable code
# always comes from the current reviewed default-branch commit.
on:
  repository_dispatch:
    types: [release_latest_recovery]

permissions: {}

concurrency:
  group: release-binaries-latest
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: Authenticate the exact latest-only failure
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      buildkit_image: ${{ steps.recovery.outputs.buildkit_image }}
      buildx_asset: ${{ steps.recovery.outputs.buildx_asset }}
      buildx_sha256: ${{ steps.recovery.outputs.buildx_sha256 }}
      container_digest: ${{ steps.recovery.outputs.container_digest }}
      container_platforms: ${{ steps.recovery.outputs.container_platforms }}
      image: ${{ steps.recovery.outputs.image }}
      record_asset_id: ${{ steps.recovery.outputs.record_asset_id }}
      record_digest: ${{ steps.recovery.outputs.record_digest }}
      release_id: ${{ steps.recovery.outputs.release_id }}
      release_merge_sha: ${{ steps.recovery.outputs.release_merge_sha }}
      release_tag: ${{ steps.recovery.outputs.release_tag }}
      run_attempt: ${{ steps.recovery.outputs.run_attempt }}
      run_id: ${{ steps.recovery.outputs.run_id }}
      source_epoch: ${{ steps.recovery.outputs.source_epoch }}
      source_sha: ${{ steps.recovery.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Buildx for credential-free immutable-index verification
        shell: bash
        run: |
          set -euo pipefail
          container_config=$(./scripts/release-targets.sh container-build)
          buildx_version=$(jq -er '.buildx_version' <<<"$container_config")
          buildx_asset="buildx-$buildx_version.linux-amd64"
          buildx_sha256=$(jq -er '.buildx_sha256["linux/amd64"]' \
            <<<"$container_config")
          if [[ ! "$buildx_asset" =~ ^buildx-v[0-9]+\.[0-9]+\.[0-9]+\.linux-amd64$ ||
                ! "$buildx_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid current-main Buildx artifact identity" >&2
            exit 1
          fi
          docker_config="$RUNNER_TEMP/verification-docker"
          plugin="$docker_config/cli-plugins/docker-buildx"
          test ! -e "$docker_config"
          mkdir -p "${plugin%/*}"
          printf '{}\n' > "$docker_config/config.json"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 \
            --connect-timeout 10 --max-time 120 \
            --output "$plugin" \
            "https://github.com/docker/buildx/releases/download/$buildx_version/$buildx_asset"
          printf '%s  %s\n' "$buildx_sha256" "$plugin" |
            sha256sum --check --strict
          chmod 755 "$plugin"
          [[ $(DOCKER_CONFIG="$docker_config" docker buildx version) == \
            "github.com/docker/buildx $buildx_version "* ]]
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Authenticate immutable release and failed-run evidence
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/verify-release-latest-recovery.sh \
            preflight "$GITHUB_OUTPUT"

  write_boundary:
    name: Reauthenticate immediately before the write-scoped job
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      buildkit_image: ${{ steps.recovery.outputs.buildkit_image }}
      buildx_asset: ${{ steps.recovery.outputs.buildx_asset }}
      buildx_sha256: ${{ steps.recovery.outputs.buildx_sha256 }}
      container_digest: ${{ steps.recovery.outputs.container_digest }}
      container_platforms: ${{ steps.recovery.outputs.container_platforms }}
      image: ${{ steps.recovery.outputs.image }}
      record_asset_id: ${{ steps.recovery.outputs.record_asset_id }}
      record_digest: ${{ steps.recovery.outputs.record_digest }}
      release_id: ${{ steps.recovery.outputs.release_id }}
      release_merge_sha: ${{ steps.recovery.outputs.release_merge_sha }}
      release_tag: ${{ steps.recovery.outputs.release_tag }}
      run_attempt: ${{ steps.recovery.outputs.run_attempt }}
      run_id: ${{ steps.recovery.outputs.run_id }}
      source_epoch: ${{ steps.recovery.outputs.source_epoch }}
      source_sha: ${{ steps.recovery.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Buildx for credential-free immutable-index verification
        shell: bash
        run: |
          set -euo pipefail
          container_config=$(./scripts/release-targets.sh container-build)
          buildx_version=$(jq -er '.buildx_version' <<<"$container_config")
          buildx_asset="buildx-$buildx_version.linux-amd64"
          buildx_sha256=$(jq -er '.buildx_sha256["linux/amd64"]' \
            <<<"$container_config")
          if [[ ! "$buildx_asset" =~ ^buildx-v[0-9]+\.[0-9]+\.[0-9]+\.linux-amd64$ ||
                ! "$buildx_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid current-main Buildx artifact identity" >&2
            exit 1
          fi
          docker_config="$RUNNER_TEMP/verification-docker"
          plugin="$docker_config/cli-plugins/docker-buildx"
          test ! -e "$docker_config"
          mkdir -p "${plugin%/*}"
          printf '{}\n' > "$docker_config/config.json"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --connect-timeout 10 --max-time 120 \
            --output "$plugin" \
            "https://github.com/docker/buildx/releases/download/$buildx_version/$buildx_asset"
          printf '%s  %s\n' "$buildx_sha256" "$plugin" |
            sha256sum --check --strict
          chmod 755 "$plugin"
          [[ $(DOCKER_CONFIG="$docker_config" docker buildx version) == \
            "github.com/docker/buildx $buildx_version "* ]]
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Repeat exact authentication at the read-only write boundary
        id: recovery
        shell: bash
        env:
          EXPECTED_BUILDKIT_IMAGE: ${{ needs.preflight.outputs.buildkit_image }}
          EXPECTED_BUILDX_ASSET: ${{ needs.preflight.outputs.buildx_asset }}
          EXPECTED_BUILDX_SHA256: ${{ needs.preflight.outputs.buildx_sha256 }}
          EXPECTED_CONTAINER_DIGEST: ${{ needs.preflight.outputs.container_digest }}
          EXPECTED_CONTAINER_PLATFORMS: ${{ needs.preflight.outputs.container_platforms }}
          EXPECTED_IMAGE: ${{ needs.preflight.outputs.image }}
          EXPECTED_RECORD_ASSET_ID: ${{ needs.preflight.outputs.record_asset_id }}
          EXPECTED_RECORD_DIGEST: ${{ needs.preflight.outputs.record_digest }}
          EXPECTED_RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
          EXPECTED_RELEASE_MERGE_SHA: ${{ needs.preflight.outputs.release_merge_sha }}
          EXPECTED_RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.preflight.outputs.run_attempt }}
          EXPECTED_RUN_ID: ${{ needs.preflight.outputs.run_id }}
          EXPECTED_SOURCE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
          EXPECTED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$RUNNER_TEMP/write-boundary-output"
          expected="$RUNNER_TEMP/expected-write-boundary-output"
          : > "$actual"
          ./scripts/verify-release-latest-recovery.sh write "$actual"
          printf '%s\n' \
            "source_sha=$EXPECTED_SOURCE_SHA" \
            "release_merge_sha=$EXPECTED_RELEASE_MERGE_SHA" \
            "run_id=$EXPECTED_RUN_ID" \
            "run_attempt=$EXPECTED_RUN_ATTEMPT" \
            "release_id=$EXPECTED_RELEASE_ID" \
            "release_tag=$EXPECTED_RELEASE_TAG" \
            "record_asset_id=$EXPECTED_RECORD_ASSET_ID" \
            "record_digest=$EXPECTED_RECORD_DIGEST" \
            "image=$EXPECTED_IMAGE" \
            "source_epoch=$EXPECTED_SOURCE_EPOCH" \
            "container_digest=$EXPECTED_CONTAINER_DIGEST" \
            "container_platforms=$EXPECTED_CONTAINER_PLATFORMS" \
            "buildkit_image=$EXPECTED_BUILDKIT_IMAGE" \
            "buildx_asset=$EXPECTED_BUILDX_ASSET" \
            "buildx_sha256=$EXPECTED_BUILDX_SHA256" > "$expected"
          cmp "$expected" "$actual"
          cat "$actual" >> "$GITHUB_OUTPUT"

  reconcile:
    name: Reconcile only the authenticated latest alias
    needs: write_boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch the exact recovery controller without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Bind write-boundary outputs and install checksum-pinned Buildx
        shell: bash
        env:
          AUTHENTICATED_BUILDKIT_IMAGE: ${{ needs.write_boundary.outputs.buildkit_image }}
          AUTHENTICATED_BUILDX_ASSET: ${{ needs.write_boundary.outputs.buildx_asset }}
          AUTHENTICATED_BUILDX_SHA256: ${{ needs.write_boundary.outputs.buildx_sha256 }}
          AUTHENTICATED_CONTAINER_DIGEST: ${{ needs.write_boundary.outputs.container_digest }}
          AUTHENTICATED_CONTAINER_PLATFORMS: ${{ needs.write_boundary.outputs.container_platforms }}
          AUTHENTICATED_IMAGE: ${{ needs.write_boundary.outputs.image }}
          AUTHENTICATED_RECORD_ASSET_ID: ${{ needs.write_boundary.outputs.record_asset_id }}
          AUTHENTICATED_RECORD_DIGEST: ${{ needs.write_boundary.outputs.record_digest }}
          AUTHENTICATED_RELEASE_ID: ${{ needs.write_boundary.outputs.release_id }}
          AUTHENTICATED_RELEASE_MERGE_SHA: ${{ needs.write_boundary.outputs.release_merge_sha }}
          AUTHENTICATED_RELEASE_TAG: ${{ needs.write_boundary.outputs.release_tag }}
          AUTHENTICATED_RUN_ATTEMPT: ${{ needs.write_boundary.outputs.run_attempt }}
          AUTHENTICATED_RUN_ID: ${{ needs.write_boundary.outputs.run_id }}
          AUTHENTICATED_SOURCE_EPOCH: ${{ needs.write_boundary.outputs.source_epoch }}
          AUTHENTICATED_SOURCE_SHA: ${{ needs.write_boundary.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          actual="$RUNNER_TEMP/authenticated-write-boundary-output"
          expected="$RUNNER_TEMP/expected-write-boundary-output"
          printf '%s\n' \
            "source_sha=$AUTHENTICATED_SOURCE_SHA" \
            "release_merge_sha=$AUTHENTICATED_RELEASE_MERGE_SHA" \
            "run_id=$AUTHENTICATED_RUN_ID" \
            "run_attempt=$AUTHENTICATED_RUN_ATTEMPT" \
            "release_id=$AUTHENTICATED_RELEASE_ID" \
            "release_tag=$AUTHENTICATED_RELEASE_TAG" \
            "record_asset_id=$AUTHENTICATED_RECORD_ASSET_ID" \
            "record_digest=$AUTHENTICATED_RECORD_DIGEST" \
            "image=$AUTHENTICATED_IMAGE" \
            "source_epoch=$AUTHENTICATED_SOURCE_EPOCH" \
            "container_digest=$AUTHENTICATED_CONTAINER_DIGEST" \
            "container_platforms=$AUTHENTICATED_CONTAINER_PLATFORMS" \
            "buildkit_image=$AUTHENTICATED_BUILDKIT_IMAGE" \
            "buildx_asset=$AUTHENTICATED_BUILDX_ASSET" \
            "buildx_sha256=$AUTHENTICATED_BUILDX_SHA256" > "$actual"
          printf '%s\n' \
            "source_sha=$GITHUB_SHA" \
            "release_merge_sha=7b51781718975772d96006f167887adb877618e7" \
            "run_id=32617933653" \
            "run_attempt=2" \
            "release_id=375116865" \
            "release_tag=v0.3.5" \
            "record_asset_id=525939539" \
            "record_digest=sha256:746b2df14a1a6d3cc8779210c3f5dd5e27691853ce231cb7842fd8b704427325" \
            "image=ghcr.io/joshrotenberg/mcp-repl" \
            "source_epoch=1787459270" \
            "container_digest=sha256:3a84dbf2da546714bcd8bde7f975e1c73a2463851c6eb584c4917f293986d46c" \
            'container_platforms=[{"platform":"linux/amd64","runnable_digest":"sha256:8f31eb764fea23b4491b4aa08566949a6be5fde0b3aa7c8b529b0ec0559806a9"},{"platform":"linux/arm64","runnable_digest":"sha256:14fb0771b1e2333c492fde114920eaa2149f823771d27fd95394651261d8e7d8"}]' \
            "buildkit_image=docker.io/moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8" \
            "buildx_asset=buildx-v0.36.1.linux-amd64" \
            "buildx_sha256=48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778" > "$expected"
          cmp "$expected" "$actual"

          buildx_release=${AUTHENTICATED_BUILDX_ASSET#buildx-}
          buildx_version=${buildx_release%%.linux-*}
          docker_config="$RUNNER_TEMP/docker-config"
          plugin="$docker_config/cli-plugins/docker-buildx"
          test ! -e "$docker_config"
          mkdir -p "${plugin%/*}"
          printf '{}\n' > "$docker_config/config.json"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 \
            --connect-timeout 10 --max-time 120 \
            --output "$plugin" \
            "https://github.com/docker/buildx/releases/download/$buildx_version/$AUTHENTICATED_BUILDX_ASSET"
          printf '%s  %s\n' "$AUTHENTICATED_BUILDX_SHA256" "$plugin" |
            sha256sum --check --strict
          chmod 755 "$plugin"
          version_output=$(DOCKER_CONFIG="$docker_config" docker buildx version)
          [[ "$version_output" == "github.com/docker/buildx $buildx_version "* ]]
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Authenticate, reconcile exact latest, and clear registry credentials
        shell: bash
        env:
          EXPECTED_LATEST_RELEASE_ID: 375116865
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logout ghcr.io > /dev/null 2>&1 || true
            printf '{}\n' > "$DOCKER_CONFIG/config.json"
          }
          trap cleanup EXIT
          [[ $(jq -cS . "$DOCKER_CONFIG/config.json") == '{}' ]]
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ./scripts/publish-container-manifest.sh latest
          cleanup
          trap - EXIT

  public_smoke:
    name: Credential-free public v0.3.5 and latest smoke
    needs:
      - write_boundary
      - reconcile
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fetch the exact recovery controller without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install checksum-pinned Buildx in an empty Docker configuration
        shell: bash
        env:
          BUILDX_ASSET: ${{ needs.write_boundary.outputs.buildx_asset }}
          BUILDX_SHA256: ${{ needs.write_boundary.outputs.buildx_sha256 }}
        run: |
          set -euo pipefail
          buildx_release=${BUILDX_ASSET#buildx-}
          buildx_version=${buildx_release%%.linux-*}
          if [[ ! "$BUILDX_ASSET" =~ ^buildx-v[0-9]+\.[0-9]+\.[0-9]+\.linux-amd64$ ||
                ! "$BUILDX_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid authenticated Buildx artifact identity" >&2
            exit 1
          fi
          anonymous_config="$RUNNER_TEMP/anonymous-docker"
          plugin="$anonymous_config/cli-plugins/docker-buildx"
          test ! -e "$anonymous_config"
          mkdir -p "${plugin%/*}"
          printf '{}\n' > "$anonymous_config/config.json"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 \
            --connect-timeout 10 --max-time 120 \
            --output "$plugin" \
            "https://github.com/docker/buildx/releases/download/$buildx_version/$BUILDX_ASSET"
          printf '%s  %s\n' "$BUILDX_SHA256" "$plugin" |
            sha256sum --check --strict
          chmod 755 "$plugin"
          test -f "$plugin" && test ! -L "$plugin"
          [[ $(DOCKER_CONFIG="$anonymous_config" docker buildx version) == \
            "github.com/docker/buildx $buildx_version "* ]]
          printf 'DOCKER_CONFIG=%s\n' "$anonymous_config" >> "$GITHUB_ENV"

      - name: Verify and execute public version and latest anonymously
        shell: bash
        env:
          EXPECTED_CONTAINER_DIGEST: ${{ needs.write_boundary.outputs.container_digest }}
          EXPECTED_CONTAINER_PLATFORMS: ${{ needs.write_boundary.outputs.container_platforms }}
          EXPECTED_IMAGE: ${{ needs.write_boundary.outputs.image }}
          EXPECTED_RECORD_ASSET_ID: ${{ needs.write_boundary.outputs.record_asset_id }}
          EXPECTED_RECORD_DIGEST: ${{ needs.write_boundary.outputs.record_digest }}
          EXPECTED_RELEASE_ID: ${{ needs.write_boundary.outputs.release_id }}
          EXPECTED_RELEASE_MERGE_SHA: ${{ needs.write_boundary.outputs.release_merge_sha }}
          EXPECTED_RELEASE_TAG: ${{ needs.write_boundary.outputs.release_tag }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.write_boundary.outputs.run_attempt }}
          EXPECTED_RUN_ID: ${{ needs.write_boundary.outputs.run_id }}
          EXPECTED_SOURCE_EPOCH: ${{ needs.write_boundary.outputs.source_epoch }}
          EXPECTED_SOURCE_SHA: ${{ needs.write_boundary.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${DOCKER_AUTH_CONFIG:-}"
          test -z "${REGISTRY_AUTH_FILE:-}"
          ./scripts/smoke-release-latest-recovery.sh
