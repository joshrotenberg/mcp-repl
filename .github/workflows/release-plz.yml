name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish crate and tag
    if: github.repository_owner == 'joshrotenberg'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      actions: write
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish with release-plz
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the released tag
        id: metadata
        if: steps.release.outputs.releases_created == 'true'
        shell: bash
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          test "$(jq 'length' <<< "$RELEASES")" = 1
          tag=$(jq -er '.[0].tag' <<< "$RELEASES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Start the native release
        if: steps.metadata.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG" --field "tag=$RELEASE_TAG"

  container:
    name: Publish container
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      push: true

  release-pr:
    name: Update release PR
    if: github.repository_owner == 'joshrotenberg'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Update with release-plz
        id: release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CI for the release PR
        if: steps.release-pr.outputs.pr != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PR" || "$RELEASE_PR" == null ]]; then
            exit 0
          fi
          branch=$(jq -er '.head_branch' <<< "$RELEASE_PR")
          gh workflow run ci.yml --ref "$branch"
