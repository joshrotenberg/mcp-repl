name: Native release build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build
        required: true
        type: string
      version:
        description: Version label used in archive names
        required: true
        type: string
      upload:
        description: Preserve packages as workflow artifacts
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  manifest:
    name: Validate release target manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      package_version: ${{ steps.targets.outputs.package_version }}
      rehearsal_toolchain: ${{ steps.targets.outputs.rehearsal_toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate and export the authoritative matrix
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release-targets.sh validate
          matrix=$(./scripts/release-targets.sh release-matrix)
          package_version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "mcp-repl") | .version')
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mcp-repl package version: $package_version" >&2
            exit 1
          fi
          {
            echo "matrix=$matrix"
            echo "package_version=$package_version"
            echo "rehearsal_toolchain=$(jq -er '.rust.rehearsal' release-targets.json)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: manifest
    runs-on: ${{ matrix.runner }}
    strategy:
      # The caller must see every failed target, but the reusable workflow
      # itself fails if even one native build or package fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ needs.manifest.outputs.rehearsal_toolchain }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install native musl toolchain
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Configure native musl compiler
        if: matrix.libc == 'musl'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cc_key=${RELEASE_TARGET//-/_}
          cargo_key=${cc_key^^}
          {
            echo "CC=musl-gcc"
            echo "CC_${cc_key}=musl-gcc"
            echo "CARGO_TARGET_${cargo_key}_LINKER=musl-gcc"
          } >> "$GITHUB_ENV"

      - name: Build native binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify Linux ABI boundary
        if: matrix.os == 'linux'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: >-
          ./scripts/verify-release-binary.sh "$RELEASE_TARGET"
          "target/$RELEASE_TARGET/release/$RELEASE_BINARY"

      - name: Rehearse release package
        id: package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          BINARY_VERSION: ${{ needs.manifest.outputs.package_version }}
        run: |
          archive=$(scripts/package-release.sh \
            "$RELEASE_TARGET" \
            "$RELEASE_VERSION" \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_BINARY" \
            "$BINARY_VERSION")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Preserve release package
        if: inputs.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
