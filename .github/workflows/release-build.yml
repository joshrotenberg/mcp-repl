name: Native release build

on:
  workflow_call:
    inputs:
      ref:
        description: Exact lowercase 40-character source commit to build
        required: true
        type: string
      version:
        description: Version label used in archive names
        required: true
        type: string
      upload:
        description: Preserve packages as workflow artifacts
        required: true
        type: boolean
      toolchain:
        description: Manifest-approved rehearsal or release Rust toolchain
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  manifest:
    name: Validate release target manifest
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      package_version: ${{ steps.targets.outputs.package_version }}
      build_toolchain: ${{ steps.targets.outputs.build_toolchain }}
      cargo_auditable: ${{ steps.targets.outputs.cargo_auditable }}
      archive_python: ${{ steps.targets.outputs.archive_python }}
      source_date_epoch: ${{ steps.targets.outputs.source_date_epoch }}
      source_sha: ${{ steps.targets.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate and export the authoritative matrix
        id: targets
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.ref }}
          REQUESTED_TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Native release source must be a lowercase 40-character commit" >&2
            exit 1
          fi
          source_sha=$(git rev-parse HEAD)
          if [[ "$source_sha" != "$EXPECTED_SOURCE" ]]; then
            echo "Native checkout $source_sha differs from $EXPECTED_SOURCE" >&2
            exit 1
          fi
          ./scripts/release-targets.sh validate
          matrix=$(./scripts/release-targets.sh release-matrix)
          package_version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "mcp-repl") | .version')
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mcp-repl package version: $package_version" >&2
            exit 1
          fi
          build_toolchain=$REQUESTED_TOOLCHAIN
          rehearsal_toolchain=$(jq -er '.rust.rehearsal' release-targets.json)
          release_toolchain=$(jq -er '.rust.release' release-targets.json)
          if [[ "$build_toolchain" != "$rehearsal_toolchain" &&
                "$build_toolchain" != "$release_toolchain" ]]; then
            echo "Toolchain $build_toolchain is outside the release manifest" >&2
            exit 1
          fi
          source_date_epoch=$(git show -s --format=%ct HEAD)
          if [[ ! "$source_date_epoch" =~ ^[1-9][0-9]*$ ||
                "$source_date_epoch" -lt 315532800 ||
                "$source_date_epoch" -gt 2147483647 ]]; then
            echo "Invalid source commit epoch: $source_date_epoch" >&2
            exit 1
          fi
          {
            echo "matrix=$matrix"
            echo "package_version=$package_version"
            echo "build_toolchain=$build_toolchain"
            echo "cargo_auditable=$(jq -er '.rust.cargo_auditable' release-targets.json)"
            echo "archive_python=$(jq -er '.rust.archive_python' release-targets.json)"
            echo "source_date_epoch=$source_date_epoch"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: manifest
    runs-on: ${{ matrix.runner }}
    strategy:
      # The caller must see every failed target, but the reusable workflow
      # itself fails if even one native build or package fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.manifest.outputs.source_sha }}
          persist-credentials: false

      - name: Recheck the exact source commit
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ needs.manifest.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ needs.manifest.outputs.build_toolchain }}
          targets: ${{ matrix.target }}

      - id: archive-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.manifest.outputs.archive_python }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install native musl toolchain
        if: matrix.libc == 'musl'
        shell: bash
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          config=$(./scripts/release-targets.sh musl-toolchain "$RELEASE_ARCH")
          package_dir="$RUNNER_TEMP/musl-toolchain"
          mkdir -p "$package_dir"
          base_url=$(jq -er '.base_url' <<<"$config")
          while IFS=$'\t' read -r filename checksum; do
            if [[ ! "$filename" =~ ^musl(-dev|-tools)?_[0-9]+\.[0-9]+\.[0-9]+-[0-9]+_(amd64|arm64)\.deb$ ||
                  ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid musl package identity: $filename" >&2
              exit 1
            fi
            curl --fail --location --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 120 \
              --output "$package_dir/$filename" "$base_url/$filename"
            printf '%s  %s\n' "$checksum" "$package_dir/$filename" |
              sha256sum --check --strict
          done < <(jq -r '.packages[] | [.filename, .sha256] | @tsv' <<<"$config")
          mapfile -t packages < <(jq -r --arg directory "$package_dir" \
            '.packages[].filename | $directory + "/" + .' <<<"$config")
          [[ ${#packages[@]} -eq 3 ]]
          sudo dpkg --install "${packages[@]}"
          version=$(jq -er '.version' <<<"$config")
          dpkg_arch=$(jq -er '.deb_arch' <<<"$config")
          for package in musl musl-dev musl-tools; do
            test "$(dpkg-query -W -f='${Version} ${Architecture}' "$package")" = \
              "$version $dpkg_arch"
          done

      - name: Configure native musl compiler
        if: matrix.libc == 'musl'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cc_key=${RELEASE_TARGET//-/_}
          cargo_key=${cc_key^^}
          {
            echo "CC_${cc_key}=musl-gcc"
            echo "CARGO_TARGET_${cargo_key}_LINKER=musl-gcc"
            # rust-lang/rust#95926: force non-PIE codegen for Jammy's musl-gcc.
            echo "CARGO_TARGET_${cargo_key}_RUSTFLAGS=-C target-feature=+crt-static -C relocation-model=static"
          } >> "$GITHUB_ENV"

      - name: Install auditable build wrapper
        shell: bash
        env:
          CARGO_AUDITABLE_VERSION: ${{ needs.manifest.outputs.cargo_auditable }}
        run: |
          set -euo pipefail
          cargo install --locked --version "$CARGO_AUDITABLE_VERSION" cargo-auditable
          test "$(cargo auditable --version)" = "cargo-auditable $CARGO_AUDITABLE_VERSION"

      - name: Build and verify native binary with embedded dependency inventory
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.manifest.outputs.source_date_epoch }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
          PACKAGE_VERSION: ${{ needs.manifest.outputs.package_version }}
          RELEASE_PYTHON: ${{ steps.archive-python.outputs.python-path }}
        run: |
          set -euo pipefail
          # A restored Cargo cache can make an otherwise identical root target
          # look fresh. Force its compile/link step before requiring the exact
          # cargo-auditable inventory from the resulting executable.
          touch src/main.rs src/lib.rs
          cargo auditable build --release --locked --target "$RELEASE_TARGET"
          "$RELEASE_PYTHON" scripts/verify-auditable-binary.py \
            "target/$RELEASE_TARGET/release/$RELEASE_BINARY" \
            mcp-repl \
            "$PACKAGE_VERSION"

      - name: Verify Linux ABI boundary
        if: matrix.os == 'linux'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: >-
          ./scripts/verify-release-binary.sh "$RELEASE_TARGET"
          "target/$RELEASE_TARGET/release/$RELEASE_BINARY"

      - name: Rehearse release package
        id: package
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ARCHIVE: ${{ matrix.archive }}
          RELEASE_BINARY: ${{ matrix.binary }}
          BINARY_VERSION: ${{ needs.manifest.outputs.package_version }}
          SOURCE_DATE_EPOCH: ${{ needs.manifest.outputs.source_date_epoch }}
          RELEASE_PACKAGE_PYTHON: ${{ steps.archive-python.outputs.python-path }}
        run: |
          archive=$(scripts/package-release.sh \
            "$RELEASE_TARGET" \
            "$RELEASE_VERSION" \
            "$RELEASE_ARCHIVE" \
            "$RELEASE_BINARY" \
            "$BINARY_VERSION" \
            "$SOURCE_DATE_EPOCH")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Preserve release package
        if: inputs.upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
