name: Release binaries

# release-plz creates a draft GitHub release before dispatching this workflow.
# Every native target must build and package successfully before this workflow
# uploads any public asset. The release is published only after all ten files
# are present and their checksums verify, so a failed target cannot expose a
# partial binary release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package every target
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ inputs.tag }}
      version: ${{ inputs.tag }}
      upload: true

  publish:
    name: Publish complete binary release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every native package
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify and publish the complete asset set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) != true ]]; then
            echo "Release $RELEASE_TAG must exist and remain a draft" >&2
            exit 1
          fi

          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          assets=()
          for target in "${targets[@]}"; do
            extension=tar.gz
            [[ "$target" == x86_64-pc-windows-msvc ]] && extension=zip
            archive="dist/mcp-repl-${RELEASE_TAG}-${target}.${extension}"
            [[ -f "$archive" && -f "$archive.sha256" ]]
            assets+=("$archive" "$archive.sha256")
          done

          file_count=$(find dist -type f | wc -l | tr -d ' ')
          if [[ "$file_count" != 10 ]]; then
            echo "Expected exactly 10 release files, found $file_count" >&2
            exit 1
          fi

          (
            cd dist
            sha256sum --check --strict ./*.sha256
          )

          # If an upload fails, the release stays private and a rerun safely
          # replaces any assets that reached the draft before the failure.
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
