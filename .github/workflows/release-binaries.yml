name: Release binaries

# release-plz creates a draft GitHub release before dispatching this workflow.
# Every native target must build and package successfully before this workflow
# uploads any public asset. The release is published only after all ten files
# are present and their checksums verify, so a failed target cannot expose a
# partial binary release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package every target
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ inputs.tag }}
      version: ${{ inputs.tag }}
      upload: true

  publish:
    name: Publish complete binary release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every native package
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify and publish the complete asset set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job downloads artifacts and talks to the API; it never needs
          # the source, so it does not check out. Without a checkout there is
          # no git remote for `gh` to infer the repository from, and every
          # `gh release` call below fails with "not a git repository" before
          # it can say anything about the release.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Asking and answering are different failures. A command
          # substitution that fails inside `[[ ]]` does not end the script
          # even under `set -e`, so a `gh` error used to arrive here as an
          # empty string and get reported as a claim about the release.
          if ! draft_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            echo "Could not read release $RELEASE_TAG; see the gh error above" >&2
            exit 1
          fi
          if [[ "$draft_state" != true ]]; then
            echo "Release $RELEASE_TAG is already published; refusing to re-attach assets" >&2
            exit 1
          fi

          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          )
          assets=()
          for target in "${targets[@]}"; do
            extension=tar.gz
            [[ "$target" == x86_64-pc-windows-msvc ]] && extension=zip
            archive="dist/mcp-repl-${RELEASE_TAG}-${target}.${extension}"
            # A bare test would exit through `set -e` and say nothing at all,
            # leaving a green-looking log ending in a bare failure.
            for required in "$archive" "$archive.sha256"; do
              if [[ ! -f "$required" ]]; then
                echo "Missing $required; the $target job produced no complete package" >&2
                exit 1
              fi
            done
            assets+=("$archive" "$archive.sha256")
          done

          file_count=$(find dist -type f | wc -l | tr -d ' ')
          if [[ "$file_count" != 10 ]]; then
            # Naming them turns "found 11" into something actionable, since
            # the extra or missing file is the whole question.
            echo "Expected exactly 10 release files, found $file_count:" >&2
            find dist -type f | sort >&2
            exit 1
          fi

          (
            cd dist
            sha256sum --check --strict ./*.sha256
          )

          # If an upload fails, the release stays private and a rerun safely
          # replaces any assets that reached the draft before the failure.
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
