version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci):"
    # CodeQL fails when its init and analyze steps run different versions,
    # and Dependabot otherwise opens a separate pull request for each step,
    # so neither bump can pass on its own. Group them into one.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
