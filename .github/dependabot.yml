version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    # Keep lockfile-only transitive updates visible too, rather than waiting
    # for a direct dependency bump or a security alert to refresh them.
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    # Group patches to avoid filling the PR limit with individual lockfile
    # changes. Keep minor/major updates separate: a 0.x minor can break Rust APIs.
    groups:
      cargo-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci):"
    # CodeQL fails when its init and analyze steps run different versions,
    # and Dependabot otherwise opens a separate pull request for each step,
    # so neither bump can pass on its own. Group them into one.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
