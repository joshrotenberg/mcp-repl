# release-plz configuration
# https://release-plz.ieni.dev/docs/config

[workspace]
# Use git-cliff for changelog generation
changelog_config = "cliff.toml"

# release-plz owns the release PR, crates.io publication, and the exact tag.
# dist consumes that tag to build and publish the native GitHub release.
publish = true
release_always = false

# dist owns the GitHub release and its binary assets.
git_release_enable = false
git_tag_enable = true
